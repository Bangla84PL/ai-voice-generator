# =============================================================================
# AI Voice Generator - CI/CD Pipeline
# =============================================================================
# Automated deployment workflow for VPS using GitHub Actions
# Triggers on push to main branch
# =============================================================================

name: Deploy to VPS

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint and Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Check formatting
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Job 2: Run Tests
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Optional: Upload coverage reports
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v3
      #   with:
      #     files: ./coverage/coverage-final.json

  # ---------------------------------------------------------------------------
  # Job 3: Build Docker Image
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ---------------------------------------------------------------------------
  # Job 4: Deploy to VPS
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://voice.smartcamp.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env.production on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            # Create app directory if it doesn't exist
            mkdir -p /opt/ai-voice-generator

            # Create .env.production file
            cat > /opt/ai-voice-generator/.env.production << 'EOF'
          NODE_ENV=production
          NEXT_PUBLIC_APP_URL=${{ secrets.APP_URL }}
          NEXT_PUBLIC_APP_NAME=AI Voice Generator

          # Supabase
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}

          # AI Providers
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          AI_VOICE_PROVIDER=openai

          # Stripe
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_PRO_MONTHLY=${{ secrets.STRIPE_PRICE_ID_PRO_MONTHLY }}
          STRIPE_PRICE_ID_ENTERPRISE_MONTHLY=${{ secrets.STRIPE_PRICE_ID_ENTERPRISE_MONTHLY }}

          # Email
          EMAIL_PROVIDER=resend
          EMAIL_API_KEY=${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME=SmartCamp.AI Voice Generator

          # n8n
          N8N_WEBHOOK_BASE_URL=${{ secrets.N8N_WEBHOOK_BASE_URL }}
          N8N_WEBHOOK_SECRET=${{ secrets.N8N_WEBHOOK_SECRET }}

          # Gotenberg
          GOTENBERG_API_URL=http://gotenberg:3000

          # Flowise
          FLOWISE_API_URL=${{ secrets.FLOWISE_API_URL }}
          FLOWISE_CHATFLOW_ID=${{ secrets.FLOWISE_CHATFLOW_ID }}
          NEXT_PUBLIC_FLOWISE_CHATFLOW_ID=${{ secrets.FLOWISE_CHATFLOW_ID }}

          # Feature Flags
          ENABLE_VOICE_CLONING=false
          ENABLE_API_ACCESS=true
          ENABLE_BATCH_PROCESSING=true
          ENABLE_CHATBOT=true
          EOF
          ENDSSH

      - name: Copy docker-compose.yml to VPS
        run: |
          scp docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/ai-voice-generator/

      - name: Deploy application
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e

            echo "🚀 Starting deployment..."

            # Navigate to app directory
            cd /opt/ai-voice-generator

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            echo "📦 Pulling latest Docker image..."
            docker-compose pull voice-generator

            # Stop and remove old containers
            echo "🛑 Stopping old containers..."
            docker-compose down --remove-orphans

            # Start new containers
            echo "▶️  Starting new containers..."
            docker-compose up -d

            # Wait for health check
            echo "🏥 Waiting for health check..."
            sleep 10

            # Check if container is running
            if [ "$(docker ps -q -f name=ai-voice-generator)" ]; then
                echo "✅ Container is running"

                # Display logs
                echo "📋 Recent logs:"
                docker-compose logs --tail=50 voice-generator

                # Health check
                HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' ai-voice-generator 2>/dev/null || echo "unknown")
                echo "🏥 Health status: $HEALTH_STATUS"

                echo "🎉 Deployment successful!"
            else
                echo "❌ Container failed to start"
                docker-compose logs voice-generator
                exit 1
            fi

            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h"

            echo "✨ Deployment complete!"
          ENDSSH

      - name: Verify deployment
        run: |
          # Wait a bit for the application to fully start
          sleep 15

          # Health check
          HEALTH_URL="https://voice.smartcamp.ai/api/health"
          echo "🏥 Checking application health: $HEALTH_URL"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed! HTTP Status: $HTTP_STATUS"
            exit 1
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi

          # Optional: Send notification to Slack, Discord, or email
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"Deployment ${{ job.status }}: AI Voice Generator"}'

  # ---------------------------------------------------------------------------
  # Job 5: Run Database Migrations (Optional)
  # ---------------------------------------------------------------------------
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🗄️ Running database migrations..."
          npm run db:migrate --if-present || echo "⚠️ No migration script found"

      - name: Seed voices (if needed)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🎤 Seeding voices..."
          npm run db:seed --if-present || echo "⚠️ No seed script found"

  # ---------------------------------------------------------------------------
  # Job 6: Security Scan (Optional)
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || true
